name: Verify VibeDock
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  server-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vibedock-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vibedock-server/e2e/package-lock.json
      - name: Server, inventory and browser tests
        run: ./scripts/verify.sh --with-deps
      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: |
            vibedock-server/e2e/playwright-report/
            vibedock-server/e2e/test-results/
          retention-days: 7
