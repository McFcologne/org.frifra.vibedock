name: Release VibeDock
# A version tag (0.2.0 or v0.2.0), pushed or created with a release on GitHub, becomes a GitHub release with:
#   vibedock-server-<version>.jar and the firmware of every board (vibedock-m1-<version>.bin,
#   vibedock-<board>-<version>.bin). The job artifacts only carry these files to the release job and are deleted after
#   a day. The Docker image is not a release file (releases up to 0.3.0 carried it as .tar.gz): it is pulled from a
#   registry, or built locally with vibedock-server/scripts/image.sh for a machine without registry access.
# The Docker image goes to the GitHub Container Registry: ghcr.io/<owner>/vibedock-server:<version> for amd64 and
# arm64, and :latest for a plain x.y.z version; with the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN also
# to Docker Hub as <username>/vibedock-server (searchable, and Synology's Container Manager shows its updates). Started by hand with a tag (Actions > Release VibeDock > Run workflow),
# the run only publishes that tag's image and leaves its release alone, e.g. for a release that is already published.
on:
  push:
    tags: ['v[0-9]*', '[0-9]*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag whose image is published (e.g. v0.1.0)'
        required: true
permissions:
  contents: write
  packages: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - id: version
        run: echo "version=$(vibedock-server/scripts/version.sh)" >> "$GITHUB_OUTPUT"

  server:
    needs: version
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        working-directory: vibedock-server
        run: |
          mvn -B verify -Drevision="${{ needs.version.outputs.version }}"
          cp target/vibedock-server.jar "vibedock-server-${{ needs.version.outputs.version }}.jar"
      - uses: actions/upload-artifact@v7
        with:
          name: server-jar
          retention-days: 1
          path: vibedock-server/vibedock-server-*.jar

  image:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build the ${{ matrix.arch }} image and push it to ghcr.io
        working-directory: vibedock-server
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.version.outputs.version }}"
          image="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/vibedock-server"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # Straight from the build to the registry: no image file. Without provenance and SBOM the stage is a plain
          # image manifest, as the pushed images were before, which publish-image joins into one tag.
          # The labels link the image to this repository on ghcr.io (also for tags built before they were added).
          docker buildx build --platform "linux/${{ matrix.arch }}" --build-context git=../.git --build-context twemoji=../third-party/twemoji \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.description=VibeDock server: AI usage on small desk displays" \
            --label "org.opencontainers.image.licenses=Apache-2.0" --label "org.opencontainers.image.version=$v" \
            --provenance=false --sbom=false \
            -t "$image:$v-${{ matrix.arch }}" --push .

  publish-image:
    # One tag for both architectures; docker pull picks the one of the host.
    needs: [version, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Tag the multi-architecture image
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          v="${{ needs.version.outputs.version }}"
          image="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/vibedock-server"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          targets="$image"
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
            targets="$targets docker.io/$(echo "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')/vibedock-server"
          else
            echo "No Docker Hub secrets: published to ghcr.io only"
          fi
          set --
          for target in $targets; do
            set -- "$@" -t "$target:$v"
            case $v in *[!0-9.]*) ;; *) set -- "$@" -t "$target:latest";; esac  # latest only for a plain x.y.z version
          done
          docker buildx imagetools create "$@" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.description=VibeDock server: AI usage on small desk displays" \
            --annotation "index:org.opencontainers.image.licenses=Apache-2.0" \
            "$image:$v-amd64" "$image:$v-arm64"
      - name: Docker Hub description from docs/DOCKERHUB.md
        # Needs a token with Read, Write, Delete; a failure only warns, the images are published already.
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ] || { echo "No Docker Hub secrets"; exit 0; }
          user=$(echo "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')
          jwt=$(jq -n --arg u "$DOCKERHUB_USERNAME" --arg p "$DOCKERHUB_TOKEN" '{username:$u,password:$p}' \
            | curl -fsS -H 'Content-Type: application/json' -d @- https://hub.docker.com/v2/users/login | jq -r .token) \
            || { echo "::warning::Docker Hub sign-in for the description failed"; exit 0; }
          jq -n --rawfile full docs/DOCKERHUB.md \
            --arg short "Self-hosted server that shows AI coding quota (Codex, Claude, ...) on small desk displays" \
            '{description:$short,full_description:$full}' \
            | curl -fsS -o /dev/null -X PATCH -H "Authorization: Bearer $jwt" -H 'Content-Type: application/json' -d @- \
              "https://hub.docker.com/v2/repositories/$user/vibedock-server/" \
            || echo "::warning::Docker Hub description not updated (the token needs Read, Write, Delete)"

  firmware:
    needs: version
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build the firmware
        working-directory: vibedock-client
        run: |
          python -m pip install "platformio==6.2.0"
          sh scripts/images.sh build
          for dir in build/*/; do board=$(basename "$dir"); case $board in vibedock-*) name=$board;; *) name=vibedock-$board;; esac
            cp "$dir/flash.bin" "$name-${{ needs.version.outputs.version }}.bin"; done
      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          retention-days: 1
          path: vibedock-client/vibedock-*.bin

  release:
    # publish-image too: no release without its Docker tags.
    needs: [version, server, image, publish-image, firmware]
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Only the release files by name: an artifact added to the run later is not published by accident.
      - uses: actions/download-artifact@v8
        with:
          name: server-jar
          path: assets
      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: assets
      - name: Create or complete the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The version's section of CHANGELOG.md goes above the commit list GitHub generates.
          v="${{ needs.version.outputs.version }}"
          awk -v v="$v" '$0 ~ "^## v?" v "$" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          # Created as a draft, completed file by file (with retries), then published, also
          # when a later run completes a release that is still a draft.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [ -s notes.md ]; then set -- --notes-file notes.md; else set --; fi
            gh release create "$TAG" --draft --title "VibeDock $v" --generate-notes --verify-tag "$@"
          fi
          for file in assets/vibedock-server-"$v".jar assets/vibedock-*-"$v".bin; do
            [ -f "$file" ] || { echo "Missing release file $file"; exit 1; }
            ok=
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$file" --clobber; then ok=1; break; fi
              echo "Upload of $file failed (attempt $attempt)"; sleep 15
            done
            [ -n "$ok" ] || { echo "Could not upload $file"; exit 1; }
          done
          gh release edit "$TAG" --draft=false
