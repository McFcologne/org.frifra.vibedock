  -D TFT_DC=16
  -D TFT_RST=23
  -D TFT_BL=4
  -D TFT_BACKLIGHT_ON=HIGH

; LilyGO T-Display-S3: ESP32-S3 with a 1.9" ST7789 170 x 320 on an 8-bit parallel bus; GPIO 15 powers the panel.
; Display settings and pins as Setup206_LilyGo_T_Display_S3 of TFT_eSPI and LilyGO's pin_config.h; the 8 MB octal PSRAM
; is on (see [esp32-s3r8]). The backlight is an AW9364 that dims by counting pulses, not by PWM: this board has no
; touch, so it always runs at full brightness.
