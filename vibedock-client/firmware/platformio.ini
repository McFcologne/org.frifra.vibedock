; One environment per supported board; the environment name is the board id the server knows (BoardType.java).
; Each build leaves firmware.bin (the app, for updates over Wi-Fi) and flash.bin (written at 0x0 when installing over
; USB) in .pio/build/<board>/, see images.py.
[platformio]
default_envs = vibedock-m1

[common]
framework = arduino
extra_scripts = pre:version.py, post:images.py
lib_deps =
  bblanchon/ArduinoJson@7.4.2
  bodmer/TFT_eSPI@2.5.43
  ricmoo/QRCode@0.0.1
build_flags =
  -D ARDUINOJSON_USE_DOUBLE=0
  -D USER_SETUP_LOADED=1
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1

[esp32]
extends = common
platform = espressif32@6.9.0
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
build_flags =
  ${common.build_flags}
  -D VIBEDOCK_CANVAS=8

; VibeTV M1: ESP8266 (ESP-12E, 4 MB) with a 1.54" ST7789 240 x 240.
[env:vibedock-m1]
extends = common
platform = espressif8266@4.2.1
board = esp12e
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld
; 160 MHz: the TLS 1.3 key exchange and certificate check take seconds at 80 MHz.
board_build.f_cpu = 160000000L
; https with TLS 1.3: Mbed TLS 3.6 (the core's BearSSL has no TLS 1.3), configured in include/vibedock_mbedtls_config.h.
lib_deps =
  ${common.lib_deps}
  kochcodes/mbedtls@3.6.2
build_flags =
  ${common.build_flags}
  -I include
  -D MBEDTLS_CONFIG_FILE=\"vibedock_mbedtls_config.h\"
  ; 16 kB less instruction cache, about 20 kB unused IRAM as a second heap: the TLS 1.3 record buffers live there.
  -D PIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48_SECHEAP_SHARED
  ; The server's certificates are parsed without a copy during the handshake, see tls13.cpp.
  -Wl,--wrap=mbedtls_x509_crt_parse_der
  -D VIBEDOCK_BOARD=\"vibedock-m1\"
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=240
  -D TFT_INVERSION_ON=1
  -D SPI_FREQUENCY=27000000
  -D TFT_MISO=-1
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=-1
  -D TFT_DC=0
  -D TFT_RST=2
  -D TFT_BL=5
  -D TFT_BACKLIGHT_ON=0

; "Cheap Yellow Display" ESP32-2432S028R: ESP32 with a 2.8" ILI9341 320 x 240 (landscape).
[env:esp32-cyd]
extends = esp32
board = esp32dev
build_flags =
  ${esp32.build_flags}
  -D VIBEDOCK_BOARD=\"esp32-cyd\"
  -D VIBEDOCK_ROTATION=1
  -D ILI9341_2_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D USE_HSPI_PORT=1
  -D SPI_FREQUENCY=40000000
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH

; LilyGO T-Display: ESP32 with a 1.14" ST7789 135 x 240.
[env:lilygo-t-display]
extends = esp32
board = esp32dev
build_flags =
  ${esp32.build_flags}
  -D VIBEDOCK_BOARD=\"lilygo-t-display\"
  -D ST7789_DRIVER=1
  -D CGRAM_OFFSET=1
  -D TFT_WIDTH=135
  -D TFT_HEIGHT=240
  -D SPI_FREQUENCY=40000000
  -D TFT_MISO=-1
  -D TFT_MOSI=19
  -D TFT_SCLK=18
  -D TFT_CS=5
  -D TFT_DC=16
  -D TFT_RST=23
  -D TFT_BL=4
  -D TFT_BACKLIGHT_ON=HIGH

; LilyGO T-Display-S3: ESP32-S3 with a 1.9" ST7789 170 x 320 on an 8-bit parallel bus; GPIO 15 powers the panel.
[env:lilygo-t-display-s3]
extends = esp32
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
build_flags =
  ${esp32.build_flags}
  -D VIBEDOCK_BOARD=\"lilygo-t-display-s3\"
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D VIBEDOCK_POWER_PIN=15
  -D ST7789_DRIVER=1
  -D INIT_SEQUENCE_3=1
  -D CGRAM_OFFSET=1
  -D TFT_RGB_ORDER=TFT_RGB
  -D TFT_INVERSION_ON=1
  -D TFT_PARALLEL_8_BIT=1
  -D TFT_WIDTH=170
  -D TFT_HEIGHT=320
  -D TFT_CS=6
  -D TFT_DC=7
  -D TFT_RST=5
  -D TFT_WR=8
  -D TFT_RD=9
  -D TFT_D0=39
  -D TFT_D1=40
  -D TFT_D2=41
  -D TFT_D3=42
  -D TFT_D4=45
  -D TFT_D5=46
  -D TFT_D6=47
  -D TFT_D7=48
  -D TFT_BL=38
  -D TFT_BACKLIGHT_ON=HIGH

; Waveshare ESP32-S3-LCD-1.69: ESP32-S3 with a 1.69" ST7789V2 240 x 280.
[env:waveshare-s3-lcd-169]
extends = esp32
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
build_flags =
  ${esp32.build_flags}
  -D VIBEDOCK_BOARD=\"waveshare-s3-lcd-169\"
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ST7789_DRIVER=1
  -D CGRAM_OFFSET=1
  -D TFT_INVERSION_ON=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=280
  -D SPI_FREQUENCY=40000000
  -D TFT_MISO=-1
  -D TFT_MOSI=7
  -D TFT_SCLK=6
  -D TFT_CS=5
  -D TFT_DC=4
  -D TFT_RST=8
  -D TFT_BL=15
  -D TFT_BACKLIGHT_ON=HIGH

; ESP32-C3 (e.g. "SuperMini") with a 1.3" ST7789 240 x 240 without CS, wired: SCL 4, SDA 6, DC 2, RES 3, BLK 10.
[env:esp32-c3-st7789]
extends = esp32
board = esp32-c3-devkitm-1
build_flags =
  ${common.build_flags}
  -D VIBEDOCK_BOARD=\"esp32-c3-st7789\"
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ST7789_DRIVER=1
  -D TFT_INVERSION_ON=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=240
  -D SPI_FREQUENCY=40000000
  -D TFT_MISO=-1
  -D TFT_MOSI=6
  -D TFT_SCLK=4
  -D TFT_CS=-1
  -D TFT_DC=2
  -D TFT_RST=3
  -D TFT_BL=10
  -D TFT_BACKLIGHT_ON=HIGH
