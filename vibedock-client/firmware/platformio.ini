; One environment per supported board; the environment name is the board id the server knows (BoardType.java).
; Each build leaves firmware.bin (the app, for updates over Wi-Fi) and flash.bin (written at 0x0 when installing over
; USB) in .pio/build/<board>/, see images.py, and manifest.json (what the build is and the hashes of both files), see
; manifest.py: the custom_* keys of an environment (label, chip, display, ...) are explained there.
[platformio]
default_envs = vibedock-m1

[common]
framework = arduino
; Speaker driver is opt-in: never compile it into builds for boards without audio.
build_src_filter = +<*> -<audio.cpp>
extra_scripts = pre:version.py, post:images.py, post:manifest.py
lib_deps =
  bblanchon/ArduinoJson@7.4.3
  bodmer/TFT_eSPI@2.5.43
  ricmoo/QRCode@0.0.1
build_flags =
  -D ARDUINOJSON_USE_DOUBLE=0
  -D USER_SETUP_LOADED=1
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1

[esp32]
extends = common
; Arduino core 3.3.12; all ESP32 boards need a new hardware soak test after this migration.
platform = espressif32@8.0.0
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
build_flags =
  ${common.build_flags}
  -D VIBEDOCK_CANVAS=8
  ; Colour correction neutral: the VibeTV M1's calibration does not fit these panels; each one is set on its status page.
  -D VIBEDOCK_TONE_GAMMA=100
  -D VIBEDOCK_TONE_RED=100
  -D VIBEDOCK_TONE_GREEN=100
  -D VIBEDOCK_TONE_BLUE=100
  ; The panic of the run before (pc, cause, address, return address) in RTC memory, sent with X-VibeDock-Diag.
  -Wl,--wrap=esp_panic_handler

; ESP32-S3R8 boards: 8 MB octal PSRAM in the chip (GPIO 33-37 belong to it). It holds the copy of the picture, so a
; turn or a new colour correction redraws without loading it again, and with the precompiled settings Wi-Fi buffers and
; allocations from 4 kB go there, leaving the internal RAM to TLS. A board without it starts all the same
; (CONFIG_SPIRAM_IGNORE_NOTFOUND) and keeps the copy only when the heap has room.
[esp32-s3r8]
board_build.arduino.memory_type = qio_opi
psram_flags = -D BOARD_HAS_PSRAM

; VibeTV M1: ESP8266 (ESP-12E, 4 MB) with a 1.54" ST7789 240 x 240.
; custom_hardware: tested (run on the real board) or prepared (builds, never tried on hardware). flash.sh,
; build.sh and the administration (Board.java) show it.
[env:vibedock-m1]
extra_scripts = ${common.extra_scripts}, pre:mbedtls_package.py
custom_hardware = tested
custom_label = VibeTV M1
custom_chip = ESP8266
custom_display = 240x240
custom_rotations = 0
extends = common
platform = espressif8266@4.2.1
board = esp12e
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld
; 160 MHz: the TLS 1.3 key exchange and certificate check take seconds at 80 MHz.
board_build.f_cpu = 160000000L
; https with TLS 1.3: Mbed TLS 3.6 (the core's BearSSL has no TLS 1.3), configured in include/vibedock_mbedtls_config.h.
lib_deps =
  ${common.lib_deps}
  https://github.com/Mbed-TLS/mbedtls/archive/refs/tags/mbedtls-3.6.7.zip
build_flags =
  ${common.build_flags}
  -I include
  -D MBEDTLS_CONFIG_FILE=\"vibedock_mbedtls_config.h\"
  ; 16 kB less instruction cache, about 20 kB unused IRAM as a second heap: the TLS 1.3 record buffers live there.
  -D PIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48_SECHEAP_SHARED
  ; The server's certificates are parsed without a copy during the handshake, see tls13.cpp.
  -Wl,--wrap=mbedtls_x509_crt_parse_der
  -D VIBEDOCK_BOARD=\"vibedock-m1\"
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=240
  -D TFT_INVERSION_ON=1
  -D SPI_FREQUENCY=27000000
  -D TFT_MISO=-1
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=-1
  -D TFT_DC=0
  -D TFT_RST=2
  -D TFT_BL=5
  -D TFT_BACKLIGHT_ON=0

; "Cheap Yellow Display" ESP32-2432S028R: ESP32 with a 2.8" ILI9341 320 x 240 (landscape). Pins and driver as on the
; original micro-USB board (witnessmenow/ESP32-Cheap-Yellow-Display PINS.md, schematic). The "CYD2USB" with micro-USB
; and USB-C has an ST7789 instead (ST7789_DRIVER, TFT_RGB_ORDER=TFT_BGR, TFT_INVERSION_OFF); the USB-C-only "v2" an
; ILI9341 that may need inversion. Touch (XPT2046) has its own SPI pins (25/32/39/33, IRQ 36) and is not used.
[env:esp32-cyd]
custom_hardware = prepared
custom_label = Cheap Yellow Display (ESP32-2432S028R)
custom_chip = ESP32
custom_display = 320x240
extends = esp32
board = esp32dev
build_flags =
  ${esp32.build_flags}
  -D VIBEDOCK_BOARD=\"esp32-cyd\"
  -D VIBEDOCK_ROTATION=1
  -D ILI9341_2_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D USE_HSPI_PORT=1
  -D SPI_FREQUENCY=40000000
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH

; LilyGO T-Display: ESP32 with a 1.14" ST7789 135 x 240 (Setup25_TTGO_T_Display of TFT_eSPI; colour order BGR and the
; offsets come from CGRAM_OFFSET). 4 MB flash on most boards, some batches 16 MB; CP2104 or CH9102F.
[env:lilygo-t-display]
custom_hardware = prepared
