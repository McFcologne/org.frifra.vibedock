; One environment per supported board; the environment name is the board id the server knows (BoardType.java).
; Each build leaves firmware.bin (the app, for updates over Wi-Fi) and flash.bin (written at 0x0 when installing over
; USB) in .pio/build/<board>/, see images.py.
[platformio]
default_envs = vibedock-m1

[common]
framework = arduino
; Speaker driver is opt-in: never compile it into builds for boards without audio.
build_src_filter = +<*> -<audio.cpp>
extra_scripts = pre:version.py, post:images.py
lib_deps =
  bblanchon/ArduinoJson@7.4.3
  bodmer/TFT_eSPI@2.5.43
  ricmoo/QRCode@0.0.1
build_flags =
  -D ARDUINOJSON_USE_DOUBLE=0
  -D USER_SETUP_LOADED=1
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1

[esp32]
extends = common
; Arduino core 3.3.12; all ESP32 boards need a new hardware soak test after this migration.
platform = espressif32@8.0.0
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
build_flags =
  ${common.build_flags}
  -D VIBEDOCK_CANVAS=8
  ; Colour correction neutral: the VibeTV M1's calibration does not fit these panels; each one is set on its status page.
  -D VIBEDOCK_TONE_GAMMA=100
  -D VIBEDOCK_TONE_RED=100
  -D VIBEDOCK_TONE_GREEN=100
  -D VIBEDOCK_TONE_BLUE=100
  ; The panic of the run before (pc, cause, address, return address) in RTC memory, sent with X-VibeDock-Diag.
  -Wl,--wrap=esp_panic_handler

; VibeTV M1: ESP8266 (ESP-12E, 4 MB) with a 1.54" ST7789 240 x 240.
; custom_hardware: tested (run on the real board) or prepared (builds, never tried on hardware). flash.sh,
; build.sh and the administration (Board.java) show it.
[env:vibedock-m1]
extra_scripts = ${common.extra_scripts}, pre:mbedtls_package.py
custom_hardware = tested
extends = common
platform = espressif8266@4.2.1
board = esp12e
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld
; 160 MHz: the TLS 1.3 key exchange and certificate check take seconds at 80 MHz.
board_build.f_cpu = 160000000L
; https with TLS 1.3: Mbed TLS 3.6 (the core's BearSSL has no TLS 1.3), configured in include/vibedock_mbedtls_config.h.
lib_deps =
  ${common.lib_deps}
  https://github.com/Mbed-TLS/mbedtls/archive/refs/tags/mbedtls-3.6.7.zip
build_flags =
  ${common.build_flags}
  -I include
  -D MBEDTLS_CONFIG_FILE=\"vibedock_mbedtls_config.h\"
  ; 16 kB less instruction cache, about 20 kB unused IRAM as a second heap: the TLS 1.3 record buffers live there.
  -D PIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48_SECHEAP_SHARED
  ; The server's certificates are parsed without a copy during the handshake, see tls13.cpp.
  -Wl,--wrap=mbedtls_x509_crt_parse_der
  -D VIBEDOCK_BOARD=\"vibedock-m1\"
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=240
  -D TFT_INVERSION_ON=1
  -D SPI_FREQUENCY=27000000
  -D TFT_MISO=-1
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=-1
  -D TFT_DC=0
  -D TFT_RST=2
  -D TFT_BL=5
  -D TFT_BACKLIGHT_ON=0

; "Cheap Yellow Display" ESP32-2432S028R: ESP32 with a 2.8" ILI9341 320 x 240 (landscape). Pins and driver as on the
; original micro-USB board (witnessmenow/ESP32-Cheap-Yellow-Display PINS.md, schematic). The "CYD2USB" with micro-USB
; and USB-C has an ST7789 instead (ST7789_DRIVER, TFT_RGB_ORDER=TFT_BGR, TFT_INVERSION_OFF); the USB-C-only "v2" an
; ILI9341 that may need inversion. Touch (XPT2046) has its own SPI pins (25/32/39/33, IRQ 36) and is not used.
[env:esp32-cyd]
custom_hardware = prepared
extends = esp32
board = esp32dev
build_flags =
  ${esp32.build_flags}
  -D VIBEDOCK_BOARD=\"esp32-cyd\"
  -D VIBEDOCK_ROTATION=1
  -D ILI9341_2_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D USE_HSPI_PORT=1
  -D SPI_FREQUENCY=40000000
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH

; LilyGO T-Display: ESP32 with a 1.14" ST7789 135 x 240 (Setup25_TTGO_T_Display of TFT_eSPI; colour order BGR and the
; offsets come from CGRAM_OFFSET). 4 MB flash on most boards, some batches 16 MB; CP2104 or CH9102F.
[env:lilygo-t-display]
custom_hardware = prepared
extends = esp32
board = esp32dev
build_flags =
  ${esp32.build_flags}
  -D VIBEDOCK_BOARD=\"lilygo-t-display\"
  ; GPIO 14 (PWR_EN / ADC_EN in LilyGO's schematic and factory sketch): HIGH on battery, also for the battery reading.
  -D VIBEDOCK_POWER_PIN=14
  -D ST7789_DRIVER=1
  -D CGRAM_OFFSET=1
  -D TFT_WIDTH=135
  -D TFT_HEIGHT=240
  -D SPI_FREQUENCY=40000000
  -D TFT_MISO=-1
  -D TFT_MOSI=19
  -D TFT_SCLK=18
  -D TFT_CS=5
  -D TFT_DC=16
  -D TFT_RST=23
  -D TFT_BL=4
  -D TFT_BACKLIGHT_ON=HIGH

; LilyGO T-Display-S3: ESP32-S3 with a 1.9" ST7789 170 x 320 on an 8-bit parallel bus; GPIO 15 powers the panel.
; Display settings and pins as Setup206_LilyGo_T_Display_S3 of TFT_eSPI and LilyGO's pin_config.h. The 8 MB octal PSRAM
; stays off (it would need memory_type qio_opi and BOARD_HAS_PSRAM; the firmware does not need it). The backlight is
; an AW9364 that dims by counting pulses, not by PWM: this board has no touch, so it always runs at full brightness.
[env:lilygo-t-display-s3]
custom_hardware = prepared
extends = esp32
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
build_flags =
  ${esp32.build_flags}
  ; A battery can be connected; the experimental power saving tells battery operation by the missing USB host.
  -D VIBEDOCK_BATTERY=1
  -D VIBEDOCK_BOARD=\"lilygo-t-display-s3\"
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D VIBEDOCK_POWER_PIN=15
  -D ST7789_DRIVER=1
  -D INIT_SEQUENCE_3=1
  -D CGRAM_OFFSET=1
  -D TFT_RGB_ORDER=TFT_RGB
  -D TFT_INVERSION_ON=1
  -D TFT_PARALLEL_8_BIT=1
  -D TFT_WIDTH=170
  -D TFT_HEIGHT=320
  -D TFT_CS=6
  -D TFT_DC=7
  -D TFT_RST=5
  -D TFT_WR=8
  -D TFT_RD=9
  -D TFT_D0=39
  -D TFT_D1=40
  -D TFT_D2=41
  -D TFT_D3=42
  -D TFT_D4=45
  -D TFT_D5=46
  -D TFT_D6=47
  -D TFT_D7=48
  -D TFT_BL=38
  -D TFT_BACKLIGHT_ON=HIGH

; Waveshare ESP32-S3-LCD-1.69: ESP32-S3 with a 1.69" ST7789V2 240 x 280 (20-row offset from CGRAM_OFFSET). Pins from
; Waveshare's demo pin_config.h and schematic V2. USB-C sits on a long side, so portrait has it at the left or right.
[env:waveshare-s3-lcd-169]
custom_hardware = prepared
extends = esp32
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
build_flags =
  ${esp32.build_flags}
  ; A battery can be connected; the experimental power saving tells battery operation by the missing USB host.
  -D VIBEDOCK_BATTERY=1
  -D VIBEDOCK_BOARD=\"waveshare-s3-lcd-169\"
  -D ARDUINO_USB_CDC_ON_BOOT=1
  ; SYS_EN keeps the board on after the PWR button is released on battery (GPIO 41 on V2 boards, GPIO 35 on V1).
  -D VIBEDOCK_POWER_PIN=41
  ; TFT_eSPI 2.5.43 on the ESP32-S3: its default FSPI port (0) gives the register address 0, begin() crashes
  -D USE_HSPI_PORT=1
  -D ST7789_DRIVER=1
  -D CGRAM_OFFSET=1
  ; With CGRAM_OFFSET TFT_eSPI drives the panel in BGR; Waveshare's demos use RGB (red and blue would be swapped).
  -D TFT_RGB_ORDER=TFT_RGB
  -D TFT_INVERSION_ON=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=280
  -D SPI_FREQUENCY=40000000
  -D TFT_MISO=-1
  -D TFT_MOSI=7
  -D TFT_SCLK=6
  -D TFT_CS=5
  -D TFT_DC=4
  -D TFT_RST=8
  -D TFT_BL=15
  -D TFT_BACKLIGHT_ON=HIGH

; Waveshare ESP32-S3-Touch-LCD-1.47: JD9853 172 x 320 (ST7789 commands plus the vendor's registers, see initJd9853 in
; main.cpp). Touch: AXS5106L on I2C 42/41, reset 48 (src/touch.h); the motion sensor (QMI8658) is not used: the
; administration sets the orientation (Flip image).
[env:waveshare-s3-touch-lcd-147]
custom_hardware = tested
extends = esp32
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
; The panel's colours, calibrated on the device page: gamma 1.50, red 100 % (from [esp32]), green 91 %, blue 76 %.
build_unflags = -D VIBEDOCK_TONE_GAMMA=100 -D VIBEDOCK_TONE_GREEN=100 -D VIBEDOCK_TONE_BLUE=100
build_flags =
  ${esp32.build_flags}
  ; A battery can be connected; the experimental power saving tells battery operation by the missing USB host.
  -D VIBEDOCK_BATTERY=1
  -D VIBEDOCK_BOARD=\"waveshare-s3-touch-lcd-147\"
  -D VIBEDOCK_TONE_GAMMA=150 -D VIBEDOCK_TONE_GREEN=91 -D VIBEDOCK_TONE_BLUE=76
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D USE_HSPI_PORT=1
  -D VIBEDOCK_PANEL_JD9853=1
  -D VIBEDOCK_TOUCH_AXS5106L=1
  -D VIBEDOCK_TOUCH_SDA=42
  -D VIBEDOCK_TOUCH_SCL=41
  -D VIBEDOCK_TOUCH_RST=48
  -D VIBEDOCK_TOUCH_MIRROR_X=1
  -D ST7789_DRIVER=1
  -D CGRAM_OFFSET=1
  -D TFT_RGB_ORDER=TFT_RGB
  -D TFT_INVERSION_ON=1
  -D TFT_WIDTH=172
  -D TFT_HEIGHT=320
  -D SPI_FREQUENCY=40000000
  -D TFT_MISO=-1
  -D TFT_MOSI=39
  -D TFT_SCLK=38
  -D TFT_CS=21
  -D TFT_DC=45
  -D TFT_RST=40
  -D TFT_BL=46
  -D TFT_BACKLIGHT_ON=HIGH

; Waveshare ESP32-S3-Touch-LCD-1.54: 240 x 240 ST7789, CST816 touch; neutral colours until hardware calibration.
; Vendor examples (revision 5157db7c888e476fd57f8a95020800377447478f):
; https://github.com/waveshareteam/ESP32-S3-Touch-LCD-1.54
; LCD: DC 45, CS 21, SCK 38, MOSI 39, RST 40, BL 46. Touch: SDA 42, SCL 41, RST 47, IRQ 48 (polled).
[env:waveshare-s3-touch-lcd-154]
custom_hardware = tested
build_src_filter = +<*>
extends = esp32
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
build_flags =
  ${esp32.build_flags}
  ; A battery can be connected; the experimental power saving tells battery operation by the missing USB host.
  -D VIBEDOCK_BATTERY=1
  -D VIBEDOCK_BOARD=\"waveshare-s3-touch-lcd-154\"
  -D VIBEDOCK_AUDIO_ES8311=1
  -D VIBEDOCK_BATTERY_ADC=1
  -D VIBEDOCK_BATTERY_CHARGE=3
  -D VIBEDOCK_POWER_PIN=2
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D USE_HSPI_PORT=1
  -D VIBEDOCK_TOUCH_CST816=1
  -D VIBEDOCK_TOUCH_SDA=42
  -D VIBEDOCK_TOUCH_SCL=41
  -D VIBEDOCK_TOUCH_RST=47
  -D ST7789_DRIVER=1
  ; The physical 1.54-inch panel needs BGR: RGB swaps red/blue (yellow appears cyan).
  -D TFT_RGB_ORDER=TFT_BGR
  -D TFT_INVERSION_ON=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=240
  -D SPI_FREQUENCY=40000000
  -D TFT_MISO=-1
  -D TFT_MOSI=39
  -D TFT_SCLK=38
  -D TFT_CS=21
  -D TFT_DC=45
  -D TFT_RST=40
  -D TFT_BL=46
  -D TFT_BACKLIGHT_ON=HIGH

; ESP32-C3 (e.g. "SuperMini") with a 1.3" ST7789 240 x 240 without CS, wired: SCL 4, SDA 6, DC 2, RES 3, BLK 10.
[env:esp32-c3-st7789]
custom_hardware = prepared
extends = esp32
board = esp32-c3-devkitm-1
build_flags =
  ${common.build_flags}
  -D VIBEDOCK_BOARD=\"esp32-c3-st7789\"
  -D VIBEDOCK_TONE_GAMMA=100
  -D VIBEDOCK_TONE_RED=100
  -D VIBEDOCK_TONE_GREEN=100
  -D VIBEDOCK_TONE_BLUE=100
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ST7789_DRIVER=1
  -D TFT_INVERSION_ON=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=240
  -D SPI_FREQUENCY=40000000
  -D TFT_MISO=-1
  -D TFT_MOSI=6
  -D TFT_SCLK=4
  -D TFT_CS=-1
  -D TFT_DC=2
  -D TFT_RST=3
  -D TFT_BL=10
  -D TFT_BACKLIGHT_ON=HIGH

; Waveshare ESP32-C6-Touch-LCD-1.69: ST7789V2 240 x 280; GPIO 15 holds the power on battery. Touch: CST816 on I2C 8/7
; (src/touch.h). The motion sensor (QMI8658), audio (ES8311) and the buttons (9, 18) are not used.
[env:waveshare-c6-touch-lcd-169]
custom_hardware = tested
extends = esp32
; pioarduino (Arduino core 3.x, ESP-IDF 5): espressif32 6.x stops at core 2.0.17, which has no ESP32-C6. It needs
; Python 3.10 or newer, and a build of its own: build.sh and images.sh build every board in a run of its own.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
extra_scripts = ${common.extra_scripts}, pre:tft_espi_c6.py
board = esp32-c6-devkitc-1
board_upload.flash_size = 4MB
; The panel's colours: the same as the Waveshare 1.47 (calibrated on the device page), red 100 % from [esp32].
build_unflags = -D VIBEDOCK_TONE_GAMMA=100 -D VIBEDOCK_TONE_GREEN=100 -D VIBEDOCK_TONE_BLUE=100
build_flags =
  ${esp32.build_flags}
  ; A battery can be connected; the experimental power saving tells battery operation by the missing USB host.
  -D VIBEDOCK_BATTERY=1
  ; Battery voltage / 3 on GPIO 0 (BAT_ADC); no charging signal (the charger's STAT is not connected).
  -D VIBEDOCK_BATTERY_ADC=0
  -D VIBEDOCK_BOARD=\"waveshare-c6-touch-lcd-169\"
  -D VIBEDOCK_TONE_GAMMA=150 -D VIBEDOCK_TONE_GREEN=91 -D VIBEDOCK_TONE_BLUE=76
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D VIBEDOCK_POWER_PIN=15
  -D VIBEDOCK_TOUCH_CST816=1
  -D VIBEDOCK_TOUCH_SDA=8
  -D VIBEDOCK_TOUCH_SCL=7
  -D ST7789_DRIVER=1
  -D CGRAM_OFFSET=1
  -D TFT_INVERSION_ON=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=280
  -D SPI_FREQUENCY=40000000
  -D TFT_MISO=-1
  -D TFT_MOSI=2
  -D TFT_SCLK=1
  -D TFT_CS=5
  -D TFT_DC=3
  -D TFT_RST=4
  -D TFT_BL=6
  -D TFT_BACKLIGHT_ON=HIGH
