services:
  vibedock:
    container_name: vibedock-server
    # Without a name Compose calls the built image <project>-<service> (vibedock-server-vibedock).
    # VIBEDOCK_IMAGE=mcfcologne/vibedock-server:latest in .env uses the published image instead:
    # docker compose pull && docker compose up -d (without --build).
    image: ${VIBEDOCK_IMAGE:-vibedock-server:latest}
    build:
      context: .
      # The image takes its version from the Git tag of these sources; the emoji graphics are versioned in the
      # repository (third-party/twemoji).
      additional_contexts:
        git: ../.git
        twemoji: ../third-party/twemoji
      # VIBEDOCK_MANUAL=skip builds without the manual PDF (quicker, for local tests).
      args:
        MANUAL: ${VIBEDOCK_MANUAL:-full}
    restart: unless-stopped
    ports:
      - "${API_BIND_ADDRESS:-0.0.0.0}:10002:10002"
      # Administration over plain HTTP; set ADMIN_PUBLISH_ADDRESS=127.0.0.1 to limit it to this host.
      - "${ADMIN_PUBLISH_ADDRESS:-0.0.0.0}:10001:10001"
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      # Quick tests only: ADMIN_AUTH=none (no sign-in; with ADMIN_PUBLISH_ADDRESS=127.0.0.1), DEMO_USAGE=true (made-up usage).
      ADMIN_AUTH: ${ADMIN_AUTH:-password}
      DEMO_USAGE: ${DEMO_USAGE:-false}
      ADMIN_BIND_ADDRESS: "0.0.0.0"
      DATA_DIR: /data
      TIME_ZONE: ${TIME_ZONE:-Europe/Berlin}
      # Addresses announced to devices when they are invited; can also be set in the administration UI.
      INTERNAL_URL: ${INTERNAL_URL:-}
      EXTERNAL_URL: ${EXTERNAL_URL:-}
      # Optional LAN TLS listener of that same reverse proxy, for routers without NAT loopback.
      EXTERNAL_TLS_PROBE_URL: ${EXTERNAL_TLS_PROBE_URL:-}
    volumes:
      # Data (settings, provider logins, clients) stays on the host and survives image rebuilds.
      # docker.data/ is excluded from Git and the image build; it contains credentials.
      - type: bind
        source: ${VIBEDOCK_DATA_PATH:-./docker.data}
        target: /data
        bind:
          create_host_path: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
