server.port=${API_PORT:10002}
server.address=0.0.0.0
server.forward-headers-strategy=none
# Relative redirects keep working behind a TLS reverse proxy that changes scheme and port.
server.tomcat.use-relative-redirects=true
server.servlet.session.timeout=15m
server.servlet.session.cookie.same-site=strict
spring.servlet.multipart.enabled=false
spring.mvc.log-request-details=false
vibedock.admin-port=${ADMIN_PORT:10001}
vibedock.admin-address=${ADMIN_BIND_ADDRESS:127.0.0.1}
vibedock.admin-user=${ADMIN_USER:admin}
vibedock.admin-password=${ADMIN_PASSWORD:}
# ADMIN_AUTH=none: the administration without sign-in, for quick local tests only (see WebSecurity).
vibedock.admin-auth=${ADMIN_AUTH:password}
# DEMO_USAGE=true: made-up usage instead of asking the providers, for tests (see DemoUsage).
vibedock.demo-usage=${DEMO_USAGE:false}
# Started directly (IDE, java -jar) in this directory, the .env of Docker Compose supplies ADMIN_PASSWORD and the other
# settings; environment variables still win. The image has no .env.
spring.config.import=optional:file:.env[.properties]
vibedock.data-dir=${DATA_DIR:./data}
# CLI credentials are decrypted only in this RAM filesystem (Linux default: /dev/shm).
vibedock.auth-runtime-dir=${AUTH_RUNTIME_DIR:}
vibedock.time-zone=${TIME_ZONE:Europe/Berlin}
vibedock.polling=${POLLING_ENABLED:true}
vibedock.emoji-dir=${EMOJI_DIR:}
# The user manual as PDF, made by the Docker build (docs/manual); the footer links it when the file exists.
vibedock.manual-file=${MANUAL_FILE:/app/manual/vibedock-manual.pdf}
logging.level.root=WARN
logging.level.org.frifra.vibedock=INFO
# Rotating logs in the data directory: daily and at 10 MB, kept 14 days, at most 200 MB.
vibedock.log-dir=${LOG_DIR:${vibedock.data-dir}/logs}
logging.file.name=${vibedock.log-dir}/vibedock.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=200MB
# Access log of both ports: sanitized request attribute, no bearer URLs, query strings or headers.
server.tomcat.accesslog.enabled=${ACCESS_LOG:true}
server.tomcat.accesslog.directory=${vibedock.log-dir}
server.tomcat.accesslog.prefix=access
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.rotate=true
server.tomcat.accesslog.buffered=false
server.tomcat.accesslog.max-days=14
server.tomcat.accesslog.pattern=%{yyyy-MM-dd HH:mm:ss}t %a :%p "%{vibedock.accessRequest}r" %s %b %{ms}Tms
vibedock.public-port=${PUBLIC_PORT:${server.port}}
vibedock.internal-url=${INTERNAL_URL:}
# Certificate Transparency search for the root of an https address the server cannot reach itself.
vibedock.certificate-log=${CERTIFICATE_LOG:https://crt.sh}
vibedock.external-url=${EXTERNAL_URL:}

# Optional LAN endpoint of the external TLS reverse proxy; external SNI and hostname checks remain active.
vibedock.external-tls-probe-url=${EXTERNAL_TLS_PROBE_URL:}
