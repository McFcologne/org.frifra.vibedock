<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · VibeDock</title>
<link rel="icon" href="/logo.svg" th:href="@{/logo.svg}" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.ico" th:href="@{/favicon.ico}" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" th:href="@{/apple-touch-icon.png}">
<link rel="stylesheet" href="../static/app.css" th:href="@{/app.css}">
<script src="../static/theme.js" th:src="@{/theme.js}"></script>
</head>
<body>
<main class="auth">
<form class="auth-card" method="post" th:action="@{/login}" autocomplete="on">
  <div class="brand">
    <img class="logo" src="../static/logo.svg" th:src="@{/logo.svg}" alt="">
    <h1>VibeDock</h1>
    <small>Administration</small>
  </div>
  <p class="notice error" th:if="${param.error}">Invalid username or password.</p>
  <p class="notice" th:if="${param.expired}">Your session has expired or the password has changed. Please sign in again.</p>
  <p class="notice" th:if="${param.logout}">You have been signed out.</p>
  <label for="username">Username</label>
  <input id="username" name="username" autocomplete="username" required autofocus>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
  <button type="submit">Sign in</button>
  <div class="auth-foot"><button type="button" class="ghost theme-toggle" data-theme-toggle aria-pressed="false">☾ Dark</button></div>
</form>
</main>
</body>
</html>
