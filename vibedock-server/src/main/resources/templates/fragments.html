<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!-- Shared parts of the administration pages. -->
<th:block th:fragment="tlsPin">
  <div class="tls-pin-status" data-tls-pin-status>
    <p class="meta" role="status" aria-live="polite" data-tls-pin-message>Checking external HTTPS pin …</p>
    <p class="meta" data-tls-pin-route hidden></p>
    <code data-tls-pin-value hidden style="overflow-wrap:anywhere"></code>
    <div class="flash-row"><button type="button" class="secondary" data-tls-pin-refresh>
      <svg th:replace="~{fragments :: icon('refresh')}"></svg><span data-tls-pin-label>Check pin again</span>
    </button></div>
    <p class="meta" role="status" aria-live="polite" data-tls-pin-action hidden></p>
    <details data-tls-cert hidden><summary>Certificate details</summary>
      <dl class="tls-cert-info meta">
        <dt>Subject</dt><dd data-cert-subject></dd>
        <dt>Issuer</dt><dd data-cert-issuer></dd>
        <dt>Valid from</dt><dd data-cert-not-before></dd>
        <dt>Valid until</dt><dd data-cert-not-after></dd>
        <dt>TLS version</dt><dd data-cert-protocol></dd>
        <dt>SHA-256</dt><dd><code data-cert-sha256></code></dd>
      </dl>
    </details>
  </div>
</th:block>
<!-- Pairing forms only offer to leave the pin out; its status and the certificate are under Settings › Network. -->
<th:block th:fragment="tlsPinOption">
  <label class="check tls-pin-option" title="The root certificate is still sent. The display verifies HTTPS itself and learns its own pin after a successful connection.">
    <input type="checkbox" name="omitTlsPin"> Do not send TLS pin (test full certificate verification)</label>
</th:block>
<head th:fragment="head(title)">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="csrf-token" th:content="${_csrf.token}"><meta name="csrf-header" th:content="${_csrf.headerName}">
<title th:text="${title} + ' · VibeDock'">VibeDock</title>
<link rel="icon" href="/logo.svg" th:href="@{/logo.svg}" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.ico" th:href="@{/favicon.ico}" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" th:href="@{/apple-touch-icon.png}">
<link rel="stylesheet" href="../static/app.css" th:href="@{/app.css}">
<script src="../static/theme.js" th:src="@{/theme.js}"></script>
<script src="../static/admin-session.js" th:src="@{/admin-session.js}"></script>
<script defer src="../static/admin-ui.js" th:src="@{/admin-ui.js}"></script>
<script defer src="../static/tls-pinning.js" th:src="@{/tls-pinning.js}"></script>
</head>
<body>
<header class="appbar" th:fragment="appbar(page)"><div class="appbar-inner">
  <a class="brand" href="/admin" th:href="@{/admin}"><img class="logo" src="../static/logo.svg" th:src="@{/logo.svg}" alt=""><span><h1>VibeDock</h1><small>Administration</small></span></a>
  <span class="spacer"></span>
  <button type="button" class="ghost theme-toggle" data-theme-toggle aria-pressed="false">☾ Dark</button>
  <form th:action="@{/logout}" method="post" th:unless="${testMode != null and #strings.contains(testMode, 'no sign-in')}"><button class="secondary">Sign out</button></form>
</div>
<nav class="admin-nav" aria-label="Administration">
  <a th:href="@{/admin}" th:classappend="${page == 'overview'} ? 'active'" th:attrappend="aria-current=${page == 'overview'} ? 'page'">Overview</a>
  <a th:href="@{/admin/devices}" th:classappend="${page == 'devices'} ? 'active'" th:attrappend="aria-current=${page == 'devices'} ? 'page'">Devices</a>
  <a th:href="@{/admin/design}" th:classappend="${page == 'design'} ? 'active'" th:attrappend="aria-current=${page == 'design'} ? 'page'">Display</a>
  <a th:href="@{/admin/sources}" th:classappend="${page == 'sources'} ? 'active'" th:attrappend="aria-current=${page == 'sources'} ? 'page'">Data sources</a>
  <a th:href="@{/admin/server}" th:classappend="${page == 'server'} ? 'active'" th:attrappend="aria-current=${page == 'server'} ? 'page'">Settings</a>
</nav></header>
<th:block th:fragment="notices">
<p class="notice error" th:if="${testMode != null}" th:text="${testMode}"></p>
<p class="notice" th:if="${param.saved}">Settings saved.</p>
<p class="notice error" th:if="${error}" th:text="${error}"></p>
<p class="notice error" th:if="${storageProblem != null and error == null}" th:text="${storageProblem}"></p>
</th:block>
<footer class="app-footer" th:fragment="footer"><div class="app-footer-inner">
  <span>VibeDock <span th:text="${appVersion}">development</span></span>
  <nav aria-label="Project information"><a th:href="${readmeUrl}" target="_blank" rel="noopener noreferrer">README</a><a th:if="${manualAvailable}" th:href="@{/admin/manual.pdf}" target="_blank" rel="noopener">Manual (PDF)</a><a th:href="@{/admin/licenses}">Licenses &amp; notices</a></nav>
</div></footer>
<span th:fragment="sourceTile(type)" class="source-tile" th:classappend="${'tile-' + type}" aria-hidden="true">
      <svg th:if="${type == 'codex'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l7 6-7 6"/><path d="M13 19h7"/></svg>
      <svg th:if="${type == 'cursor'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l16 6.5-7 2.5-2.5 7z"/></svg>
      <svg th:if="${type == 'gemini'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c.6 4.6 3.4 7.4 9 9-5.6 1.6-8.4 4.4-9 9-.6-4.6-3.4-7.4-9-9 5.6-1.6 8.4-4.4 9-9z"/></svg>
      <svg th:if="${type == 'grok'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19 7.5A8 8 0 1 0 20 12"/><circle cx="19.5" cy="5" r="1.4"/></svg>
      <svg th:if="${type == 'claude'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 8V5M10 4h4M2 13v2M22 13v2"/><circle cx="9" cy="13.5" r=".6" fill="currentColor"/><circle cx="15" cy="13.5" r=".6" fill="currentColor"/></svg>
</span>
<svg th:fragment="icon(name)" class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<g th:if="${name == 'activity'}"><path d="M3 12h4l3 8 4-16 3 8h4"/></g>
<g th:if="${name == 'monitor'}"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></g>
<g th:if="${name == 'palette'}"><path d="M12 3a9 9 0 1 0 0 18h1a2 2 0 0 0 1-3.7 1 1 0 0 1 1-1.8h2a4 4 0 0 0 4-4A9 9 0 0 0 12 3Z"/><path d="M7 10h.01M10 6h.01M15 7h.01M17 11h.01"/></g>
<g th:if="${name == 'bands'}"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16"/></g>
<g th:if="${name == 'globe'}"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3"/></g>
<g th:if="${name == 'plus'}"><path d="M12 5v14M5 12h14"/></g>
<g th:if="${name == 'refresh'}"><path d="M20 11a8 8 0 1 0-2 6M20 4v7h-7"/></g>
</svg>
</body></html>
