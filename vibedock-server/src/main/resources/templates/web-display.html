<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><title th:text="${'VibeDock · ' + name}">VibeDock</title>
<!-- Home screen (iOS web clip, Android): full screen, the VibeDock icon, the display's name. -->
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-title" th:content="${name}">
<link rel="apple-touch-icon" th:href="${icon}"><link rel="icon" type="image/png" th:href="${icon}">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
/* The image area leaves out the notch and the home indicator. */
.screen{position:fixed;top:env(safe-area-inset-top);right:env(safe-area-inset-right);bottom:env(safe-area-inset-bottom);left:env(safe-area-inset-left);
  background-position:center;background-size:contain;background-repeat:no-repeat}
.stale{position:fixed;right:calc(12px + env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));font:12px system-ui,sans-serif;color:#fff;background:rgba(180,35,53,.85);padding:4px 9px;border-radius:99px;display:none}
</style></head>
<body th:attr="data-image=${image},data-reload=${reload}"><div class="screen"></div><span class="stale" role="status"></span>
<script>
// Asks for the image in the size of the screen area and the screen's pixel ratio, so it is drawn sharp; a new size
// (rotation, window resized) loads a new image. Swaps the image only once the next one has loaded, so the screen never
// goes blank; keeps the last image offline.
(() => {
  const body = document.body, screen = document.querySelector('.screen'), stale = document.querySelector('.stale'), every = Number(body.dataset.reload) * 1000;
  let last = null, resized = null;
  const time = date => date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  function load() {
    const ratio = Math.round((window.devicePixelRatio || 1) * 100) / 100;
    const url = body.dataset.image + '?w=' + screen.clientWidth + '&h=' + screen.clientHeight + '&r=' + ratio + '&t=' + Date.now(), next = new Image();
    next.onload = () => { screen.style.backgroundImage = 'url("' + url + '")'; last = new Date(); stale.style.display = 'none'; };
    next.onerror = () => { stale.textContent = last ? 'offline · last image ' + time(last) : 'offline'; stale.style.display = 'inline-block'; };
    next.src = url;
  }
  window.addEventListener('resize', () => { clearTimeout(resized); resized = setTimeout(load, 300); });
  load(); setInterval(load, every);
})();
</script>
</body></html>
